<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Shader Background</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070c;
    }
    #bg-webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .ambient-veil {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(5,7,12,0.02) 0%, rgba(5,7,12,0.35) 100%);
      pointer-events: none;
    }
    .vignette-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .cyber-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="bg-webgl-container"></div>
  <div class="cyber-grid"></div>
  <div class="ambient-veil"></div>
  <div class="vignette-layer"></div>

  <script type="module">
    import { renderShader } from './shaders.js';
    
    window.setShader = function(shaderName) {
      console.log("[CyberShader] Ativando shader:", shaderName);
      renderShader(shaderName);
    };

    // Lê shader inicial da URL ou usa 'strands'
    const urlParams = new URLSearchParams(window.location.search);
    const initialShader = urlParams.get('shader') || 'strands';
    
    // Inicia imediatamente
    renderShader(initialShader);
  </script>
</body>
</html>
